name: BrewLite CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: CI ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - name: Check app
        id: check-app
        working-directory: .
        run: |
          if [ -f "apps/${{ matrix.app }}/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Skipping CI steps: apps/${{ matrix.app }}/package.json is missing."
          fi
      - uses: actions/setup-node@v4
        if: steps.check-app.outputs.exists == 'true'
        with:
          node-version: '22'
      - name: Install
        if: steps.check-app.outputs.exists == 'true'
        run: npm ci
      - name: Lint
        if: steps.check-app.outputs.exists == 'true'
        run: npm run lint
      - name: Unit Test
        if: steps.check-app.outputs.exists == 'true'
        run: npm test
        env:
          CI: 'true'
      - name: Build
        if: steps.check-app.outputs.exists == 'true'
        run: npm run build
  integration:
    name: CI PostgreSQL integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brewlite_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite_test -d brewlite_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://brewlite_test:ci_test_password@127.0.0.1:5432/brewlite_test
      TEST_DATABASE_URL: postgresql://brewlite_test:ci_test_password@127.0.0.1:5432/brewlite_test

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

  docker:
    name: Build Docker images
    needs: [quality, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build --tag "brewlite-api:$GITHUB_SHA" apps/api
          docker build --tag "brewlite-web:$GITHUB_SHA" apps/web

  deploy:
    name: Deploy and smoke test on Render
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [docker]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    concurrency:
      group: brew-lite-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release commit is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Deploy API and Web
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_WEB_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: bash scripts/deploy-render.sh
