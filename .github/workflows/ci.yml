name: BrewLite CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: CI ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit Test
        run: npm test
        env:
          CI: 'true'
      - name: Build
        run: npm run build
