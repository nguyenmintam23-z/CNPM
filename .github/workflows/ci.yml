name: BrewLite CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: CI ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [web, api]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - name: Check app
        id: check-app
        working-directory: .
        run: |
          if [ -f "apps/${{ matrix.app }}/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Skipping CI steps: apps/${{ matrix.app }}/package.json is missing."
          fi
      - uses: actions/setup-node@v4
        if: steps.check-app.outputs.exists == 'true'
        with:
          node-version: '22'
      - name: Install
        if: steps.check-app.outputs.exists == 'true'
        run: npm ci
      - name: Lint
        if: steps.check-app.outputs.exists == 'true'
        run: npm run lint
      - name: Unit Test
        if: steps.check-app.outputs.exists == 'true'
        run: npm test
        env:
          CI: 'true'
      - name: Build
        if: steps.check-app.outputs.exists == 'true'
        run: npm run build
  integration:
    name: CI PostgreSQL integration
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: brewlite_test
          POSTGRES_PASSWORD: ci_test_password
          POSTGRES_DB: brewlite_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U brewlite_test -d brewlite_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://brewlite_test:ci_test_password@127.0.0.1:5432/brewlite_test
      TEST_DATABASE_URL: postgresql://brewlite_test:ci_test_password@127.0.0.1:5432/brewlite_test

    defaults:
      run:
        working-directory: apps/api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install
        run: npm ci

      - name: Apply database migrations
        run: npm run prisma:migrate:deploy

      - name: Run PostgreSQL integration tests
        run: npm run test:integration

  e2e:
    name: E2E Playwright
    # Trước mắt chỉ chạy cho PR, và chỉ khi PR đổi Web, API, test E2E, docker-compose.yml hoặc chính workflow này.
    # Chưa phải check bắt buộc; nhóm chốt sau khi job chạy ổn định.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    concurrency:
      group: e2e-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    env:
      COMPOSE_PROJECT_NAME: brewlite-e2e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check changed paths
        id: changes
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          if echo "$changed" | grep -Eq '^(apps/(web|api)/|tests/e2e/|docker-compose\.yml$|\.github/workflows/ci\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Không đổi Web/API/E2E: bỏ qua E2E."
          fi

      - name: Start Web, API and PostgreSQL (Docker Compose, database riêng)
        if: steps.changes.outputs.run == 'true'
        run: |
          # Mật khẩu ngẫu nhiên cho database dùng một lần trên runner, không dùng secret của repo.
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "JWT_SECRET=$(openssl rand -hex 32)"
          } > .env
          docker compose down -v --remove-orphans
          docker compose up --build -d

      - name: Wait for API /health and Web /healthz
        if: steps.changes.outputs.run == 'true'
        run: |
          # curl --fail trả mã lỗi khi chưa có HTTP 2xx; nằm trong điều kiện if nên chỉ quyết định thử lại, không bỏ qua lỗi.
          for attempt in $(seq 1 90); do
            if curl --silent --fail --output /dev/null http://localhost:3001/health &&
               curl --silent --fail --output /dev/null http://localhost:3000/healthz; then
              echo "API /health và Web /healthz trả 200 sau $attempt lần thử"
              exit 0
            fi
            sleep 2
          done
          echo "API hoặc Web chưa sẵn sàng sau 3 phút" >&2
          exit 1

      - name: Seed database
        if: steps.changes.outputs.run == 'true'
        run: |
          # Container api chạy NODE_ENV=production nên seed cần hai mật khẩu; tạo ngẫu nhiên vì E2E không dùng tài khoản nội bộ.
          docker compose exec -T \
            -e SEED_STAFF_PASSWORD="$(openssl rand -hex 12)" \
            -e SEED_MANAGER_PASSWORD="$(openssl rand -hex 12)" \
            api npx prisma db seed

      - uses: actions/setup-node@v4
        if: steps.changes.outputs.run == 'true'
        with:
          node-version: '22'

      - name: Install Playwright
        if: steps.changes.outputs.run == 'true'
        working-directory: tests/e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run E2E
        if: steps.changes.outputs.run == 'true'
        working-directory: tests/e2e
        run: npx playwright test
        env:
          CI: 'true'
          E2E_BASE_URL: http://localhost:3000

      - name: Save Docker Compose logs
        if: always() && steps.changes.outputs.run == 'true'
        run: docker compose logs --no-color > tests/e2e/docker-compose.log 2>&1

      - name: Upload Playwright report, trace and logs
        if: always() && steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            tests/e2e/playwright-report/
            tests/e2e/test-results/
            tests/e2e/docker-compose.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop Docker Compose
        if: always() && steps.changes.outputs.run == 'true'
        run: docker compose down -v --remove-orphans

  docker:
    name: Build Docker images
    needs: [quality, integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          docker build --tag "brewlite-api:$GITHUB_SHA" apps/api
          docker build --tag "brewlite-web:$GITHUB_SHA" apps/web

  deploy:
    name: Deploy and smoke test on Render
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [docker]
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: production
    concurrency:
      group: brew-lite-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify release commit is on main
        run: git merge-base --is-ancestor HEAD origin/main
      - name: Deploy API and Web
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_API_SERVICE_ID: ${{ vars.RENDER_API_SERVICE_ID }}
          RENDER_WEB_SERVICE_ID: ${{ vars.RENDER_WEB_SERVICE_ID }}
          API_URL: ${{ vars.API_URL }}
          WEB_URL: ${{ vars.WEB_URL }}
        run: bash scripts/deploy-render.sh
